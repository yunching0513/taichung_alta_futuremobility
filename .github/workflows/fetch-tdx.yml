# 手動觸發：用 repository secrets 裡的 TDX 金鑰抓資料，抓完直接提交進版控。
#
# 金鑰放在 Settings → Secrets and variables → Actions → New repository secret：
#     TDX_CLIENT_ID
#     TDX_CLIENT_SECRET
#
# 這樣金鑰只存在 GitHub 的加密儲存區：不經過對話、不落在筆電上、不進版控。
# GitHub 會把 secret 在 log 裡遮成 ***，所以就算某一步印出來也看不到。
#
# 刻意做成 workflow_dispatch 而不是排程：TDX 免費會員有流量上限，
# 而且這些是幾乎不會變的靜態資料（車站位置、路線線形），沒有天天抓的理由。
#
# only 這個輸入是給「額度用完」準備的：TDX 的限制是按時間算的，
# 民國115年8月22日那一次，軌道五個端點把該分鐘的額度用完，公車五個接著送就全回 429。
# 隔一段時間再跑一次，only 填 bus_shape_taichung.json 之類的檔名，就只補那幾份。
#
# 抓完提交的是 data_TW/from_tdx/ 的原始 JSON。平常的部署（pages.yml）只讀
# 已經納入版控的原始檔，因此**部署不需要金鑰**，這一支跟那一支是分開的。

name: 抓 TDX 資料

on:
  workflow_dispatch:
    inputs:
      only:
        description: '只抓這幾份（逗號分隔的檔名，留空＝全部）。額度用完時單獨補抓某一份用'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓 TDX
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          TDX_ONLY: ${{ inputs.only }}
        run: python3 scripts/fetch_tdx.py

      - name: 重跑管線
        run: |
          python3 scripts/prep_districts.py
          python3 scripts/prep_rail.py
          python3 scripts/prep_bus.py
          python3 scripts/prep_crash.py
          python3 scripts/prep_villages.py
          python3 scripts/prep_roads.py
          python3 scripts/prep_access.py

      - name: 確認沒有把金鑰寫進檔案
        run: |
          if grep -rIl -e "$TDX_CLIENT_SECRET" data_TW data 2>/dev/null | grep -q .; then
            echo "抓下來的檔案裡出現了 secret，停下來"; exit 1
          fi
          echo "檢查通過"
        env:
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_TW/from_tdx data
          if git diff --cached --quiet; then
            echo "資料沒有變動，不提交"
          else
            git commit \
              -m "抓 TDX 資料（$(date -u +%Y-%m-%d)）" \
              -m "由 fetch-tdx.yml 手動觸發，data_TW/from_tdx/ 是原始 JSON，並重跑 prep 更新中間檔。"
            git push
          fi
